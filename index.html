<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nick Martinez Insurance Agency</title>
<meta name="description" content="My business is built on referrals (friends, family, co-workers). Do you know one or two people that may want better insurance?">
<meta property="og:title" content="We Love Referrals!"><meta property="og:description" content="My business is built on referrals (friends, family, co-workers). Do you know one or two people that may want better insurance?"><meta property="og:image" content="https://assets.agencyzoom.com/images/refer/love-referral.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Open Sans',sans-serif;color:#222;background:#e1e8f0;font-size:14px}
.page{display:flex;min-height:100vh}.sidebar{width:220px;background:#fff;text-align:center;padding:58px 15px;flex-shrink:0}
.sidebar img{width:94px;height:117px;object-fit:cover;border-radius:50%}.sidebar h2{font-size:19px;font-weight:700;margin:16px 0 8px}
.sidebar .agency{font-size:13px}.contacts{margin-top:36px}.contacts a{display:block;background:#1a90f5;color:#fff;border-radius:14px;padding:6px 8px;margin:5px auto;width:132px;font-size:10px;text-decoration:none}
.content{padding:22px 28px;flex:1;max-width:584px}.card{background:#fff;padding:18px 18px 22px;margin-bottom:18px}
.card h2{font-size:19px;font-weight:700;margin:0 0 8px}.msg{font-size:13px;line-height:1.4;margin-bottom:24px}
.row{display:flex;gap:21px;margin-bottom:14px}.row>*{flex:1;min-width:0}
input,select{width:100%;padding:5px 9px;border:1px solid #ccc;border-radius:3px;font:inherit;font-size:13px;height:28px;color:#333}
.ref+.ref{border-top:1px dashed #ddd;padding-top:16px}.add{display:inline-block;margin:14px 0 24px;color:#1a90f5;text-decoration:none;font-size:13px}
.actions{border-top:1px solid #ddd;padding-top:22px;text-align:right}button{background:#1a90f5;color:#fff;border:0;border-radius:2px;width:132px;height:32px;font:inherit;font-size:13px;cursor:pointer}
.rm{color:#c33;font-size:12px;text-decoration:none;float:right}
@media(max-width:700px){.page{flex-direction:column}.sidebar{width:100%;padding:24px}.row{flex-direction:column;gap:14px}.content{padding:15px}}
</style></head><body>
<div class="page"><div class="sidebar">
<img src="https://assets.agencyzoom.com/logo/refer/dorp/grok-image-d384abf3-fd02-450d-b45e-54843d02b1bc.jpg1788984031.png" alt="Norma Ramirez">
<h2>Norma Ramirez</h2><div class="agency">Nick Martinez Insurance Agency</div>
<div class="contacts"><a href="tel:4694664407"><i class="fa fa-phone"></i> (469) 466-4407</a><a href="mailto:norma@powertopick.com"><i class="fa fa-envelope-o"></i> norma@powertopick.com</a></div>
</div>
<div class="content"><form action="https://formsubmit.co/norma@powertopick.com" method="POST">
<input type="hidden" name="_subject" value="New Referral - Norma Ramirez Referral Page">
<input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="true">
<input type="text" name="_honey" style="display:none">
<div class="card"><h2>Tell Us About You</h2>
<div class="row"><input name="Your First Name" placeholder="Your First Name" required><input name="Your Last Name" placeholder="Your Last Name" required></div>
<div class="row"><input type="email" name="Your Email" placeholder="Your Email" required><input type="tel" name="Your Phone Number" placeholder="Your Phone Number"></div>
</div>
<div class="card"><h2>Refer Your Friends or Family Members</h2>
<div class="msg">My business is built on referrals (friends, family, co-workers). Do you know one or two people that may want better insurance?</div>
<div id="refs"></div>
<a href="#" class="add" id="add"><i class="fa fa-plus"></i> Add another referral</a>
<div class="actions"><button type="submit">Submit</button></div>
</div></form></div></div>
<script>
var n=0,states="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
function add(){n++;var p="Referral "+n+" ",d=document.createElement("div");d.className="ref";
d.innerHTML=(n>1?'<a href="#" class="rm">Remove</a><div style="clear:both"></div>':'')+
'<div class="row"><input name="'+p+'First Name" placeholder="First Name" required><input name="'+p+'Last Name" placeholder="Last Name"></div>'+
'<div class="row"><input type="email" name="'+p+'Email" placeholder="Email"><input type="tel" name="'+p+'Phone" placeholder="Phone"></div>'+
'<div class="row"><input name="'+p+'Street Address" placeholder="Street Address" autocomplete="street-address"></div>'+
'<div class="row"><input name="'+p+'City" placeholder="City"><select name="'+p+'State"><option value="">State</option>'+states.map(function(s){return'<option'+(s=="TX"?'':'')+'>'+s+'</option>'}).join("")+'</select><input name="'+p+'ZIP" placeholder="ZIP" inputmode="numeric" pattern="\\d{5}(-\\d{4})?" maxlength="10"></div>';
var rm=d.querySelector(".rm");if(rm)rm.onclick=function(e){e.preventDefault();d.remove()};
document.getElementById("refs").appendChild(d)}
add();document.getElementById("add").onclick=function(e){e.preventDefault();add()};
</script></body></html>
